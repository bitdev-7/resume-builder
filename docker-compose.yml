# Production stack for Resume Maker.
#
#   docker compose up -d --build
#
# Only the frontend is published to the host (port 80). The backend is reachable
# only on the internal Docker network, so the browser talks to the frontend and
# Next.js proxies /api/* to the backend container (see frontend/next.config.js).
#
# Values in ${...} are interpolated from a `.env` file next to this compose file.
# That `.env` is written on the VPS by the GitHub Actions deploy workflow.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      # Deterministic, regardless of what the .env secret contains.
      NODE_ENV: production
      PORT: "4000"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the browser bundle at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # Leave empty to use the same-origin Next.js proxy to the backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NODE_ENV: production
      # Server-side proxy target used by next.config.js rewrites().
      BACKEND_URL: http://backend:4000
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
